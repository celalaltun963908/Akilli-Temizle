name: Windows 10 compatible EXE (x64)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Run unit tests
        run: python -m unittest -v test_motor.py
      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name AkilliTemizle --collect-all fitz --collect-all pymupdf arayuz.py
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkilliTemizle-Windows-x64
          path: dist/AkilliTemizle.exe
          if-no-files-found: error
